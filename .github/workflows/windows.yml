name: windows

# On Windows `agtmls install` takes the Python installer (_lib/installer.py)
# instead of setup-workspace.sh, and a link it may not make falls back to a
# copy. The gate in validate.yml is shell-heavy and runs on Linux and macOS;
# this runs what a Windows user meets: the unit suite, and an install,
# verify and uninstall through the CLI, at the supported floor and ceiling.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python scripts/run-unit-tests.py
      - name: Install, verify and uninstall through the CLI
        run: |
          target="$RUNNER_TEMP/consumer"
          mkdir -p "$target"
          git -C "$target" init -q
          python scripts/agtmls.py install rust claude --target "$target" --copy
          python scripts/agtmls.py verify claude --target "$target"
          python scripts/agtmls.py uninstall claude --target "$target" --remove-prompt
          test ! -e "$target/CLAUDE.md"
