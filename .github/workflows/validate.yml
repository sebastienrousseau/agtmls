name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # PRs run the supported floor and ceiling; main and tags run all five.
        python-version: ${{ (github.event_name == 'pull_request' && fromJSON('["3.10","3.14"]')) || fromJSON('["3.10","3.11","3.12","3.13","3.14"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference validator
        # skills-ref requires Python >=3.11, so the 3.10 leg skips it. On 3.11+
        # a failed install must fail the run: validate-spec-conformance.py
        # treats a missing validator in CI as FAIL, not SKIP.
        if: matrix.python-version != '3.10'
        run: python3 -m pip install --disable-pip-version-check 'skills-ref==0.1.0'
      - name: Verify commit signatures
        # README states signing is required. Until this step, that was an
        # honour-system policy rather than a control.
        if: github.event_name == 'pull_request'
        run: |
          git config gpg.ssh.allowedSignersFile KEYS.asc
          unsigned=0
          # --no-merges: on a pull_request event HEAD is the synthetic merge
          # commit GitHub creates, which no contributor signs. Authored commits
          # on both sides of it are still checked.
          for commit in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            author=$(git log -1 --format='%an' "$commit")
            # A bot's commits are signed by GitHub's key, not by a maintainer
            # key in KEYS.asc, so they verify as E here. That is a different
            # trust path -- authenticated by the forge, not by us -- and this
            # gate governs contributor commits. Excluding them is deliberate;
            # a human commit pushed to a bot's branch is still checked.
            case "$author" in
              *"[bot]") echo "skipping bot commit $commit ($author)"; continue ;;
            esac
            status=$(git log -1 --format='%G?' "$commit")
            if [ "$status" != "G" ] && [ "$status" != "U" ]; then
              echo "::error::unsigned or unverifiable commit $commit (%G? = $status)"
              unsigned=1
            fi
          done
          test "$unsigned" -eq 0
      - name: Validate Skills
        run: python3 scripts/validate-skills.py
      - name: Validate Spec Conformance
        run: python3 scripts/validate-spec-conformance.py
      - name: Validate Licence Headers
        run: python3 scripts/validate-licence-headers.py
      - name: Validate Commands
        run: python3 scripts/validate-commands.py
      - name: Validate Plugin Manifest
        run: python3 scripts/validate-plugin-manifest.py
      - name: Validate Packaging
        run: python3 scripts/validate-packaging.py
      - name: Validate Providers
        run: python3 scripts/validate-providers.py
      - name: Validate Profiles
        run: python3 scripts/validate-profiles.py
      - name: Validate Templates
        run: python3 scripts/validate-templates.py
      - name: Validate Doc Links
        run: python3 scripts/validate-doc-links.py
      - name: Validate Json Files
        run: python3 scripts/validate-json-files.py
      - name: Validate Python Scripts
        run: python3 scripts/validate-python-scripts.py
      - name: Validate Shell Syntax
        run: python3 scripts/validate-shell-syntax.py
      - name: Validate Secrets
        run: python3 scripts/validate-secrets.py
      - name: Validate Gitignore
        run: python3 scripts/validate-gitignore.py
      - name: Validate Cli Surface
        run: python3 scripts/validate-cli-surface.py
      - name: Validate System Prompts
        run: python3 scripts/validate-system-prompts.py
      - name: Check Skill Collisions
        run: python3 scripts/check-skill-collisions.py
      - name: Validate Eval Cases
        run: python3 scripts/validate-eval-cases.py
      - name: Check Spec Rule Snapshot
        run: python3 scripts/sync-spec-rules.py --check
      - name: Validate Security Claims
        run: python3 scripts/validate-security-claims.py
      - name: Run Security Evals
        run: python3 scripts/run-security-evals.py
      - name: Audit Registry Skills
        run: python3 scripts/audit-skill.py --all --strict
      - name: Run Trigger Evals
        run: python3 scripts/run-trigger-evals.py
      - name: Run Behavioral Evals
        run: python3 scripts/run-behavioral-evals.py
      - name: Validate Skill Metadata
        run: python3 scripts/validate-skill-metadata.py
      - name: Sync Skill Frontmatter Check
        run: python3 scripts/sync-skill-frontmatter.py --check
      - name: Generate Plugin Manifests Check
        run: python3 scripts/generate-plugin-manifests.py --check
      - name: Generate Skill Index Check
        run: python3 scripts/generate-skill-index.py --check
      - name: Generate Catalog Check
        run: python3 scripts/generate-catalog.py --check
      - name: Generate Docs Site Check
        run: python3 scripts/generate-docs-site.py --check
      - name: Generate Mcp Resources Check
        run: python3 scripts/generate-mcp-resources.py --check
      - name: Generate Benchmarks Doc Check
        run: python3 scripts/generate-benchmarks-doc.py --check
      - name: Generate Sbom Check
        run: python3 scripts/generate-sbom.py --check
      - name: Validate Sbom Conformance
        run: python3 scripts/validate-sbom-conformance.py
      - name: Generate Provenance Check
        run: python3 scripts/generate-provenance.py --check
      - name: Validate Generated Artifacts
        run: python3 scripts/validate-generated-artifacts.py
      - name: Validate Docs Site
        run: python3 scripts/validate-docs-site.py
      - name: Validate Governance
        run: python3 scripts/validate-governance.py
      - name: Validate Skill Index
        run: python3 scripts/validate-skill-index.py
      - name: Validate Lifecycle
        run: python3 scripts/validate-lifecycle.py
      - name: Validate Version Policy
        run: python3 scripts/validate-version-policy.py
      - name: Validate Release
        run: python3 scripts/validate-release.py
      - name: Release Check
        run: python3 scripts/release-check.py
      - name: Smoke Release Pack
        run: python3 scripts/smoke-release-pack.py
      - name: Smoke Next Version
        run: python3 scripts/smoke-next-version.py
      - name: Smoke Bump Version Check
        run: python3 scripts/smoke-bump-version-check.py
      - name: Smoke Release Dry Run
        run: python3 scripts/smoke-release-dry-run.py
      - name: Smoke Evolve Evidence
        run: python3 scripts/smoke-evolve-evidence.py
      - name: Smoke Provider Install
        run: python3 scripts/smoke-provider-install.py
      - name: Smoke Live Providers
        # Deliberately keyless here: the script exits 0 with no credentials,
        # and live-provider-smoke.yml does the credentialed run on a schedule.
        # This step exists so CI runs every check in checks.json.
        run: python3 scripts/smoke-live-providers.py
      - name: Smoke Install
        run: python3 scripts/smoke-install.py
      - name: Smoke Install Safety
        run: python3 scripts/smoke-install-safety.py
      - name: Smoke Install Verify
        run: python3 scripts/smoke-install-verify.py
      - name: Smoke Install Profiles
        run: python3 scripts/smoke-install-profiles.py
      - name: Smoke Cli
        run: python3 scripts/smoke-cli.py
      - name: Smoke Offline
        # "No telemetry" is a positioning claim; this is the control behind it.
        run: python3 scripts/smoke-offline.py
      - name: Smoke Make Install
        run: python3 scripts/smoke-make-install.py
      - name: Smoke Export
        run: python3 scripts/smoke-export.py
      - name: Smoke Import
        run: python3 scripts/smoke-import.py
      - name: Smoke Proposal
        run: python3 scripts/smoke-proposal.py
      - name: Smoke Scaffold
        run: python3 scripts/smoke-scaffold.py
      - name: Run Unit Tests
        run: python3 scripts/run-unit-tests.py
      - name: Bench
        # --smoke: one iteration per workload, no timing assertions. The
        # regression check needs an idle machine, and runs in bench.yml.
        run: python3 scripts/bench.py --smoke
      - name: Validate Check Manifest
        run: python3 scripts/validate-check-manifest.py
      - name: Agtmls Doctor
        # Every check in checks.json already ran as its own step above. Without
        # --skip-gate the doctor runs the entire gate a second time, on every
        # leg of the matrix.
        run: python3 scripts/agtmls-doctor.py --skip-gate

  # Branch protection requires a status check literally named
  # "validate-skills". Matrix legs report as "checks (os, version)", which
  # would never satisfy it, so this job carries the name and passes only when
  # every leg passed.
  validate-skills:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every matrix leg passed
        run: |
          echo "checks result: ${{ needs.checks.result }}"
          test "${{ needs.checks.result }}" = "success"
