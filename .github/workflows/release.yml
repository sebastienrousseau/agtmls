name: release

# One build, published twice. The files attached to the GitHub release and
# the files uploaded to PyPI are the same bytes: the build job checksums them,
# attaches them to a draft release, audits what GitHub holds, and hands the
# identical files to the publish job as an artifact. The publish job used to
# rebuild the wheel and sdist; those builds happen to be byte-identical here,
# but nothing guaranteed it and nothing checked it.
on:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v0.0.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.0.2"
        required: true
      dry_run:
        description: "Build and validate without publishing anything"
        type: boolean
        default: true
      publish_existing:
        description: "Publish the wheel and sdist already attached to the tag's release, instead of building"
        type: boolean
        default: false

permissions:
  contents: write
  # Build provenance is signed via Sigstore against the workflow identity;
  # id-token is what proves the artifacts came from this repo and ref.
  attestations: write
  id-token: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v0.0.') || (github.event_name == 'workflow_dispatch' && !inputs.publish_existing)
    runs-on: ubuntu-latest
    steps:
      # The release content: the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "$VERSION" = "${{ steps.version.outputs.version }}"
          python3 scripts/validate-version-policy.py
          python3 scripts/release-dry-run.py --version "${{ steps.version.outputs.version }}" --skip-check --profile minimal --provider generic
      - name: Install reference validator
        run: python3 -m pip install --disable-pip-version-check 'skills-ref==0.1.0'
      - name: Full release gate
        run: python3 scripts/agtmls.py check
      - name: Build release assets
        run: python3 scripts/release-pack.py --out-dir dist/release --profile polyglot
      - name: Build Python distributions
        run: |
          python3 -m pip install --disable-pip-version-check build
          python3 -m build --outdir dist/python
      - name: Collect and checksum every asset
        # One directory, one SHA256SUMS over everything published, wheel and
        # sdist included -- release-pack's own list covers the exports only.
        run: |
          mkdir -p dist/assets
          cp dist/release/*.tar.gz dist/release/release-manifest.json dist/python/* dist/assets/
          (cd dist/assets && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS)
          cat dist/assets/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/assets/*"
      - name: Verify the wheel installs and runs
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --disable-pip-version-check dist/assets/*.whl
          test "$(/tmp/verify/bin/agtmls stats --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["registry_version"])')" \
            = "${{ steps.version.outputs.version }}"
      - name: Keep the exact files for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/assets/
          if-no-files-found: error
      # The release tooling and notes: this workflow's own commit. For a tag
      # push the two are the same; re-releasing an older tag by dispatch runs
      # today's checks and notes over that tag's content. Checked out only
      # after the gate and the builds: inside the tree, it would be scanned
      # and packed as if it were the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          path: tooling
      - name: Write the release body
        run: |
          python3 tooling/scripts/release-body.py --tag "${{ steps.version.outputs.tag }}" \
            --notes-dir tooling/docs/release-notes --sums dist/assets/SHA256SUMS --out dist/body.md
      - name: Attach assets to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Assets are counted through the release's own assets endpoint, by
          # id. The asset list GitHub embeds in a release -- which
          # `gh release view` reads -- showed none of v0.0.6's 17 assets for
          # about 40 minutes after they were attached.
          release_id() {
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1
          }
          asset_count() {
            gh api "repos/${{ github.repository }}/releases/$1/assets?per_page=100" --jq 'length'
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release that exists already may only be empty: completing a
            # release whose upload failed, never replacing one that shipped.
            count="$(asset_count "$(release_id)")"
            if [ "$count" != "0" ]; then
              echo "::error::$TAG already has $count asset(s); refusing to replace a published release"
              exit 1
            fi
            gh release edit "$TAG" --draft --title "AgtMLS $TAG" --notes-file dist/body.md
            gh release upload "$TAG" dist/assets/*
          else
            gh release create "$TAG" dist/assets/* --draft --verify-tag \
              --title "AgtMLS $TAG" --notes-file dist/body.md
          fi
          # Count what GitHub actually holds before anyone can see it.
          expected="$(ls dist/assets | wc -l | tr -d ' ')"
          attached="$(asset_count "$(release_id)")"
          if [ "$attached" != "$expected" ]; then
            echo "::error::$TAG has $attached of $expected assets attached; the release stays a draft"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
      - name: Audit the published release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tooling/scripts/release-audit.py --tag "${{ steps.version.outputs.tag }}" \
            --commit "$(git rev-parse HEAD)" --before-pypi

  # For a release that is already public: its attached files are the release,
  # so PyPI gets exactly those bytes. Each is checked against the release's
  # SHA256SUMS and the release is audited before anything is handed on.
  from-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download and verify the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # By asset id: `gh release download` reads the release's embedded
          # asset list, which for v0.0.6 showed none of its 17 assets.
          mkdir -p dist/assets
          id="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)"
          gh api "repos/${{ github.repository }}/releases/$id/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' | while read -r asset name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$asset" > "dist/assets/$name"
          done
          # SHA256SUMS must name every other asset, and every one must match.
          listed="$(wc -l < dist/assets/SHA256SUMS | tr -d ' ')"
          attached="$(ls dist/assets | grep -vc '^SHA256SUMS$')"
          test "$listed" = "$attached"
          (cd dist/assets && sha256sum -c SHA256SUMS)
      - name: Audit the release before handing it on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-audit.py --tag "${{ inputs.tag }}" \
            --commit "$(git rev-parse "${{ inputs.tag }}^{commit}")" --before-pypi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/assets/
          if-no-files-found: error

  # Trusted Publishing: no long-lived PyPI token exists to leak, and PyPI
  # records PEP 740 attestations for the uploaded files. The files are the
  # release's -- from the build job, or from the published release -- and are
  # never rebuilt here.
  publish-pypi:
    needs: [release, from-release]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.from-release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/assets
      - name: Select the Python distributions
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist/pypi
          cp "dist/assets/agtmls-${VERSION}-py3-none-any.whl" "dist/assets/agtmls-${VERSION}.tar.gz" dist/pypi/
          # The bytes to upload are the bytes the release lists.
          (cd dist/assets && grep -E "  agtmls-${VERSION}(-py3-none-any\.whl|\.tar\.gz)$" SHA256SUMS | sha256sum -c -)
          ls -l dist/pypi
      # A rehearsal that stops before the registry. Without one, the first
      # time this path runs for real is also the first time it runs at all.
      - name: Publish (dry run)
        if: inputs.dry_run
        run: |
          python3 -m pip install --disable-pip-version-check twine
          python3 -m twine check dist/pypi/*
          echo "dry run: validated $(ls dist/pypi | wc -l) file(s); nothing uploaded"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: ${{ !inputs.dry_run }}
        with:
          packages-dir: dist/pypi/
          attestations: true
