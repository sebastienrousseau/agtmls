name: docs

# Markdown lint and link checks on every change; the docs site deployed to
# GitHub Pages from main. External links are checked weekly rather than per
# PR: a remote outage should not block a change that did not touch it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Runtime egress and process monitoring; audit records, never blocks.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # markdownlint-cli2 0.24.0, with .markdownlint-cli2.jsonc.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      # The two template-shaped files, under their own rules.
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-template.jsonc
          globs: |
            README.md
            BENCHMARKS.md

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Runtime egress and process monitoring; audit records, never blocks.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose offline or full
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "offline=" >> "$GITHUB_OUTPUT"
          else
            echo "offline=--offline" >> "$GITHUB_OUTPUT"
          fi
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            ${{ steps.mode.outputs.offline }}
            --no-progress --include-fragments
            --accept 200..=299,403,429
            --exclude-path docs/evidence
            --exclude-path evals/uplift/fixtures
            --exclude-path fuzz/corpus
            --exclude-path .github/PULL_REQUEST_TEMPLATE.md
            './**/*.md'

  pages:
    name: deploy docs site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [markdown, links]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runtime egress and process monitoring; audit records, never blocks.
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # site/ is generated by generate-docs-site.py and checked current in
      # the gate, so what is committed on main is what is served.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
