[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agtmls"
version = "0.0.13"
description = "The universal agent skills registry — polyglot engineering skills and system prompts for Claude Code, Codex, Aider, and compatible agents."
readme = "README.md"
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
authors = [{ name = "Sebastien Rousseau" }]
keywords = ["agent", "skills", "registry", "claude", "codex", "llm", "prompts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]
# Deliberately dependency-free: every script in the registry is stdlib-only,
# which is what makes `uvx agtmls` a single fast download with nothing to
# resolve.
dependencies = []

[project.urls]
Homepage = "https://github.com/sebastienrousseau/agtmls"
Repository = "https://github.com/sebastienrousseau/agtmls"
Changelog = "https://github.com/sebastienrousseau/agtmls/blob/main/CHANGELOG.md"

[project.scripts]
agtmls = "agtmls.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agtmls"]

# The registry is shipped verbatim under agtmls/_registry/. That layout is
# load-bearing: every script resolves its root as `Path(__file__).parent.parent`,
# so placing scripts/ at agtmls/_registry/scripts/ makes the registry root
# resolve correctly inside the wheel with no code change. Keep this list in
# sync with scripts/validate-packaging.py, which fails the build gate if the
# wheel would omit something the CLI needs.
# hatch_build.py adds index.json.sig beside index.json when CI has signed it.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "agtmls/_registry/scripts"
"skills" = "agtmls/_registry/skills"
"commands" = "agtmls/_registry/commands"
"agents" = "agtmls/_registry/agents"
"system-prompts" = "agtmls/_registry/system-prompts"
"references" = "agtmls/_registry/references"
"templates" = "agtmls/_registry/templates"
"evals" = "agtmls/_registry/evals"
"index.json" = "agtmls/_registry/index.json"
"ALLOWED_SIGNERS" = "agtmls/_registry/ALLOWED_SIGNERS"
"profiles.json" = "agtmls/_registry/profiles.json"
"providers.json" = "agtmls/_registry/providers.json"
"lifecycle.json" = "agtmls/_registry/lifecycle.json"
"checks.json" = "agtmls/_registry/checks.json"
"CATALOG.md" = "agtmls/_registry/CATALOG.md"
"LICENSE-APACHE" = "agtmls/_registry/LICENSE-APACHE"
"LICENSE-MIT" = "agtmls/_registry/LICENSE-MIT"
".claude-plugin/plugin.json" = "agtmls/_registry/.claude-plugin/plugin.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/agtmls",
  "scripts",
  "skills",
  "commands",
  "agents",
  "system-prompts",
  "references",
  "templates",
  "evals",
  "*.json",
  "*.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "ALLOWED_SIGNERS",
  "hatch_build.py",
  "index.json.sig",
]
# The release signature is gitignored, and hatch leaves gitignored files out
# of an sdist unless they are artifacts. The release builds its wheel from
# the sdist, so without this the wheel would ship unsigned.
artifacts = ["index.json.sig"]

# Coverage of the tooling, not of the registry data it validates. Subprocess
# tracing is on because most of this repository's work happens in child
# processes: the gate runs 64 of them, and a measurement that saw only what
# the parent executed would report a number with no relationship to what the
# tests exercise.
[tool.coverage.run]
branch = true
parallel = true
source = ["scripts", "src"]
omit = [
  "*/__pycache__/*",
  "scripts/_lib/scaling.py",
  # smoke-*.py are tests. They drive installs, exports and `make install`
  # end to end, and the gate runs each as a subprocess. Measuring how much
  # of the test code the tests execute is not a coverage number anybody can
  # act on -- the convention everywhere else is to exclude the suite, and
  # these are the suite.
  "scripts/smoke-*.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  # A module's own entry point is exercised by running it, which the gate does
  # 64 times; counting the two lines that call main() adds noise, not signal.
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff.lint]
# Ruff's defaults plus the two rules the code already carries reasoned
# `noqa` directives for. Without them every one of those directives was
# itself a finding (RUF100), so a clean run was impossible. CI pins the
# ruff version, because the default rule set grows between releases.
extend-select = ["E402", "SLF001"]
